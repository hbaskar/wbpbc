<div class="court-designer-wrapper">
  <div class="designer-header">
    <h1 class="designer-title">Basketball Court Designer</h1>
    <p class="designer-subtitle">Customize a basketball court with main court colors, key area, and optional hash marks and blocks.</p>
  </div>
  
  <div class="court-designer-container">
    <div class="designer-controls">

    <!-- 3-Point Line Distance -->
    <div class="form-group">
      <label>3-Point Line Distance</label>
      <input type="text" class="distance-input" value="College (22′1.75″)" readonly />
      <p class="distance-note">
        Distance (in feet) from the basket is locked to college specs.
        Free throw line is 15 feet from baseline.
      </p>
    </div>

    <!-- Main Court -->
    <div class="form-group">
      <app-color-picker
        [options]="mainCourtColorOptions"
        [selectedValue]="mainCourtColor()"
        label="Main Court Color:"
        zone="main-court"
        (valueChange)="onMainCourtColorChange($event)"
      ></app-color-picker>
    </div>

    <!-- Inside Key -->
    <div class="form-group">
      <app-color-picker
        [options]="keyColorOptions"
        [selectedValue]="keyColor()"
        label="Inside Key Color:"
        zone="key-area"
        (valueChange)="onKeyColorChange($event)"
      ></app-color-picker>
    </div>

    <!-- Show Hash Marks -->
    <div class="form-check">
      <input
        type="checkbox"
        id="hashMarksCheckbox"
        [checked]="showHashMarks()"
        (change)="onHashMarksChange($any($event.target).checked)"
      />
      <label for="hashMarksCheckbox">Show Hash Marks & Blocks</label>
    </div>
  </div>

  <!-- Court preview -->
  <div class="court-visualization">
    <svg #courtSvg id="basketballCourtSVG" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 250">
      <!-- Main court -->
      <rect id="mainCourtRect" x="0" y="0" width="250" height="250" fill="#47614c"></rect>
      <!-- Key area -->
      <rect id="keyRect" x="65" y="0" width="120" height="172.5" fill="#284d80" stroke="#ffffff" stroke-width="3"></rect>
      <!-- Free throw line -->
      <line stroke="white" stroke-width="3" x1="65" y1="172.5" x2="185" y2="172.5"></line>
      <!-- Free throw arc -->
      <path id="freeThrowArc" d="M 65,172.5 A 60 60 0 0 0 185,172.5" fill="none" stroke="white" stroke-width="3"></path>
      <!-- Bottom baseline arc area -->
      <path id="baselineArc" d="M 0,195.7 A 227.5 227.5 0 0 0 250,195.7 L 250,250 L 0,250 Z" fill="#284d80"></path>
      <!-- Three point arc -->
      <path id="threePointArc" d="M 1,195.7 A 227.5 227.5 0 0 0 249,195.7" fill="none" stroke="white" stroke-width="3"></path>
      <!-- Baselines -->
      <line stroke="white" stroke-width="4" x1="0" y1="0" x2="0" y2="250"></line>
      <line stroke="white" stroke-width="4" x1="250" y1="0" x2="250" y2="250"></line>
      <line stroke="white" stroke-width="4" x1="0" y1="0" x2="250" y2="0"></line>
      <line stroke="white" stroke-width="4" x1="0" y1="250" x2="250" y2="250"></line>
      
      <!-- Hash Marks & Blocks Group -->
      <g id="hashMarksGroup" stroke="white" stroke-width="2" visibility="visible">
        <!-- Left side hashes -->
        <line x1="63" y1="20" x2="50" y2="20" stroke-width="4"></line>
        <line x1="63" y1="50" x2="55" y2="50"></line>
        <line x1="63" y1="80" x2="55" y2="80"></line>
        <line x1="63" y1="110" x2="55" y2="110"></line>
        <line x1="63" y1="140" x2="55" y2="140"></line>
        <!-- Right side hashes -->
        <line x1="187" y1="20" x2="200" y2="20" stroke-width="4"></line>
        <line x1="187" y1="50" x2="195" y2="50"></line>
        <line x1="187" y1="80" x2="195" y2="80"></line>
        <line x1="187" y1="110" x2="195" y2="110"></line>
        <line x1="187" y1="140" x2="195" y2="140"></line>
      </g>
    </svg>
  </div>
  </div>
</div>
