<div class="color-option">
  @if (label) {
    <label>{{ label }}</label>
  }
  <div class="custom-select" [class.open]="isOpen()" #selectElement>
    <div
      class="selected-option"
      [style.background]="selectedOption()?.displayColor || '#fff'"
      [style.color]="selectedOption() ? getTextColor(selectedOption()!.displayColor) : '#000'"
      (click)="toggleDropdown($event)"
    >
      <span class="title">{{ selectedOption()?.label || 'Select...' }}</span>
      <span class="arrow">▼</span>
    </div>
    <div class="custom-options">
      @for (option of options; track option.value) {
        <div
          class="option"
          [attr.data-value]="option.value"
          [style.background]="option.displayColor"
          [style.color]="option.textColor || getTextColor(option.displayColor)"
          (click)="selectOption(option, $event)"
        >
          <div class="swatch" [style.background]="option.displayColor"></div>
          {{ option.label }}
        </div>
      }
    </div>
  </div>
</div>
